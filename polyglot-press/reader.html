<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Read Issue — The Polyglot Press</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .reader-stage{
    min-height:calc(100vh - 90px); display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, #1B2A52 0%, #0C1730 75%); perspective:1800px; padding:40px 20px;
  }
  .book{ position:relative; width:min(360px, 80vw); aspect-ratio:3/4; cursor:pointer; }
  .book-cover{
    position:absolute; inset:0; background-size:cover; background-position:center;
    background:linear-gradient(135deg, #1B2A52, #2E4272, #B7922E);
    transform-origin:left center; transition:transform 1s cubic-bezier(.6,.05,.2,1);
    box-shadow:0 30px 60px rgba(0,0,0,0.5); border-radius:2px 6px 6px 2px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px;
  }
  .book.open .book-cover{ transform:rotateY(-150deg); box-shadow:none; }
  .book-cover .kicker{ color:#F3E9CE; }
  .book-cover h1{ color:#fff; font-size:1.6rem; margin:10px 0; }
  .book-cover p{ color:#C9CEDA; font-size:0.9rem; }
  .book-spine{ position:absolute; left:0; top:0; bottom:0; width:14px; background:#0C1730; border-radius:2px 0 0 2px; }
  .hint{ text-align:center; color:#C9CEDA; font-size:0.85rem; margin-top:22px; font-family:var(--sans); }
  .book.open + .hint{ opacity:0; }

  .reader-frame{
    display:none; width:100%; max-width:900px; height:80vh; background:#111;
    box-shadow:0 30px 80px rgba(0,0,0,0.6); border-radius:2px; overflow:hidden;
  }
  .reader-frame iframe{ width:100%; height:100%; border:none; }
  .reader-frame.show{ display:block; }
  .back-link{ position:fixed; top:24px; left:24px; z-index:10; }
</style>
</head>
<body style="background:#0C1730;">

<a href="archive.html" class="btn btn-outline back-link" style="background:#fff;">← Back to Archive</a>

<div class="reader-stage" id="stage">
  <div>
    <div class="book" id="book">
      <div class="book-spine"></div>
      <div class="book-cover" id="bookCover">
        <div class="kicker" id="issueKicker">Issue</div>
        <h1 id="issueTitle">Loading…</h1>
        <p id="issueDesc"></p>
      </div>
    </div>
    <p class="hint" id="hint">Click the cover to open</p>
  </div>
  <div class="reader-frame" id="readerFrame">
    <iframe id="pdfFrame" src=""></iframe>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/auth.js"></script>
<script src="assets/content.js"></script>
<script>
(async function () {
  const params = new URLSearchParams(window.location.search);
  const issueNumber = params.get("issue");
  let pdfUrl = "#";

  try {
    let query = supabaseClient.from("issues").select("*");
    if (issueNumber) query = query.eq("issue_number", issueNumber);
    else query = query.order("issue_number", { ascending: false }).limit(1);
    const { data } = await query;
    const issue = data && data[0];
    if (issue) {
      document.getElementById("issueKicker").textContent = "Issue " + String(issue.issue_number).padStart(2, "0");
      document.getElementById("issueTitle").textContent = issue.title;
      document.getElementById("issueDesc").textContent = issue.description || "";
      if (issue.cover_url) document.getElementById("bookCover").style.background = `url(${issue.cover_url}) center/cover`;
      if (issue.pdf_url) pdfUrl = issue.pdf_url;
    } else {
      document.getElementById("issueTitle").textContent = "Issue not found";
    }
  } catch (e) {
    document.getElementById("issueTitle").textContent = "The Patience Issue";
    document.getElementById("issueDesc").textContent = "September 2026";
  }

  document.getElementById("book").addEventListener("click", function () {
    this.classList.add("open");
    document.getElementById("hint").style.opacity = "0";
    setTimeout(() => {
      document.getElementById("stage").style.display = "none";
      const frame = document.getElementById("readerFrame");
      document.getElementById("pdfFrame").src = pdfUrl;
      document.body.appendChild(frame);
      frame.classList.add("show");
    }, 900);
  });
})();
</script>
</body>
</html>
