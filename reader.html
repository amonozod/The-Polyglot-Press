<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Read Issue — The Polyglot Press</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  body{ background:var(--navy-deep); }
  .reader-stage{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, var(--navy) 0%, var(--navy-deep) 75%); perspective:2000px; padding:20px 10px;
  }

  /* ---- Intro cover ---- */
  .book-intro{ position:relative; width:min(360px, 80vw); aspect-ratio:3/4; cursor:pointer; }
  .book-cover{
    position:absolute; inset:0; background-size:cover; background-position:center;
    background:linear-gradient(135deg, var(--navy), var(--navy-deep), var(--gold));
    transform-origin:left center; transition:transform 1s cubic-bezier(.6,.05,.2,1);
    box-shadow:0 30px 60px rgba(0,0,0,0.5); border-radius:2px 6px 6px 2px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px;
  }
  .book-intro.open .book-cover{ transform:rotateY(-150deg); box-shadow:none; }
  .book-spine{ position:absolute; left:0; top:0; bottom:0; width:14px; background:var(--navy-deep); border-radius:2px 0 0 2px; }
  .book-cover .kicker{ color:var(--gold-tint); }
  .book-cover h1{ color:#fff; font-size:1.6rem; margin:10px 0; }
  .book-cover p{ color:#C9CEDA; font-size:0.9rem; }
  .hint{ text-align:center; color:#C9CEDA; font-size:0.85rem; margin-top:22px; font-family:var(--sans); }

  /* ---- Custom single-page book viewer ---- */
  #bookViewer{ display:none; flex-direction:column; align-items:center; gap:22px; width:100%; }
  #bookViewer.show{ display:flex; }
  .page-frame{
    position:relative; box-shadow:0 40px 100px rgba(0,0,0,0.65);
    background:#fff; border-radius:2px; overflow:visible;
  }
  .page-face{
    position:absolute; inset:0; width:100%; height:100%; backface-visibility:hidden;
    border-radius:2px; overflow:hidden; background:#fff;
  }
  .page-face img{ width:100%; height:100%; object-fit:cover; display:block; }
  .page-face.back{ transform:rotateY(180deg); }
  .flip-layer{
    position:absolute; inset:0; width:100%; height:100%; transform-style:preserve-3d;
    transition:transform 0.7s cubic-bezier(.4,.1,.2,1); transform-origin:left center; z-index:20;
  }
  .flip-layer.flipping{ transform:rotateY(-180deg); }
  .static-current, .static-next{ position:absolute; inset:0; width:100%; height:100%; border-radius:2px; overflow:hidden; }
  .static-next{ z-index:5; }
  .static-current{ z-index:10; }

  .reader-controls{ display:flex; align-items:center; gap:18px; }
  .reader-controls button{
    width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,0.1); color:#fff;
    border:1px solid rgba(255,255,255,0.2); font-size:1.2rem;
  }
  .reader-controls button:disabled{ opacity:0.3; }
  .reader-controls button:not(:disabled):hover{ background:rgba(255,255,255,0.2); }
  .page-indicator{ color:#C9CEDA; font-family:var(--mono); font-size:0.85rem; min-width:70px; text-align:center; }

  .reader-frame{ display:none; width:100%; max-width:900px; height:80vh; background:#111; box-shadow:0 30px 80px rgba(0,0,0,0.6); }
  .reader-frame iframe{ width:100%; height:100%; border:none; }
  .reader-frame.show{ display:block; }
  .back-link{ position:fixed; top:24px; left:24px; z-index:1000; background:rgba(255,255,255,0.08); backdrop-filter:blur(6px); }

  .issue-comments{ display:none; width:100%; max-width:680px; margin:40px auto 80px; padding:0 20px; }
  .issue-comments.show{ display:block; }
  .issue-comments h2{ color:#fff; font-size:1.3rem; margin-bottom:22px; }
  .issue-comments .comment-form input, .issue-comments .comment-form textarea{
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.18); color:#fff;
  }
  .issue-comments .comment-form input::placeholder, .issue-comments .comment-form textarea::placeholder{ color:#8A93AD; }
  .issue-comments .comment-item{ border-bottom:1px solid rgba(255,255,255,0.14); }
  .issue-comments .comment-name{ color:#fff; }
  .issue-comments .comment-date{ color:#8A93AD; }
  .issue-comments .comment-text{ color:#C9CEDA; }
</style>
</head>
<body>

<a href="archive.html" class="btn btn-outline back-link">← Back to Archive</a>

<div class="reader-stage" id="stage">
  <div id="introView">
    <div class="book-intro" id="book">
      <div class="book-spine"></div>
      <div class="book-cover" id="bookCover">
        <div class="kicker" id="issueKicker">Issue</div>
        <h1 id="issueTitle">Loading…</h1>
        <p id="issueDesc"></p>
      </div>
    </div>
    <p class="hint" id="hint">Click the cover to open</p>
  </div>

  <div id="bookViewer">
    <div class="page-frame" id="pageFrame"></div>
    <div class="reader-controls">
      <button id="prevBtn" aria-label="Previous page">‹</button>
      <span class="page-indicator" id="pageIndicator">1 / 1</span>
      <button id="nextBtn" aria-label="Next page">›</button>
    </div>
  </div>

  <div class="reader-frame" id="readerFrame">
    <iframe id="pdfFrame" src=""></iframe>
  </div>
</div>

<section class="issue-comments" id="issueComments">
  <h2>Join the discussion</h2>
  <form class="comment-form" id="commentForm">
    <input type="text" id="commentName" placeholder="Name">
    <textarea id="commentText" placeholder="Comment" required></textarea>
    <button type="submit" class="btn btn-gold" style="justify-self:start;">Post Comment</button>
  </form>
  <div id="commentList"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/auth.js"></script>
<script src="assets/content.js"></script>
<script>
(async function () {
  const params = new URLSearchParams(window.location.search);
  const issueNumber = params.get("issue");
  let pdfUrl = null;
  let pageImages = null;
  let issueSlug = "issue-unknown";

  try {
    let query = supabaseClient.from("issues").select("*");
    if (issueNumber) query = query.eq("issue_number", issueNumber);
    else query = query.order("issue_number", { ascending: false }).limit(1);
    const { data } = await query;
    const issue = data && data[0];
    if (issue) {
      document.getElementById("issueKicker").textContent = "Issue " + String(issue.issue_number).padStart(2, "0");
      document.getElementById("issueTitle").textContent = issue.title;
      document.getElementById("issueDesc").textContent = issue.description || "";
      if (issue.cover_url) document.getElementById("bookCover").style.background = `url(${issue.cover_url}) center/cover`;
      if (issue.pdf_url) pdfUrl = issue.pdf_url;
      if (issue.pages && issue.pages.length) pageImages = issue.pages;
      issueSlug = "issue-" + issue.issue_number;
    } else {
      document.getElementById("issueTitle").textContent = "Issue not found";
    }
  } catch (e) {
    document.getElementById("issueTitle").textContent = "The Patience Issue";
  }

  document.getElementById("book").addEventListener("click", function () {
    this.classList.add("open");
    document.getElementById("hint").style.opacity = "0";
    setTimeout(() => {
      document.getElementById("introView").style.display = "none";

      if (pageImages && pageImages.length > 1) {
        initBookViewer(pageImages.slice(1)); // page 1 already shown as the cover
      } else if (pdfUrl) {
        const frame = document.getElementById("readerFrame");
        document.getElementById("pdfFrame").src = pdfUrl;
        frame.classList.add("show");
      }

      document.getElementById("issueComments").classList.add("show");
      loadComments(issueSlug, "commentList");
      document.getElementById("commentForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("commentName").value.trim() || "Anonymous";
        const text = document.getElementById("commentText").value.trim();
        if (!text) return;
        try { await postComment(issueSlug, name, text); } catch (err) {}
        loadComments(issueSlug, "commentList");
        e.target.reset();
      });
    }, 900);
  });

  function initBookViewer(pages) {
    const viewer = document.getElementById("bookViewer");
    viewer.classList.add("show");

    const frame = document.getElementById("pageFrame");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const indicator = document.getElementById("pageIndicator");

    const isMobile = window.innerWidth < 700;
    const availH = window.innerHeight - 170;
    const availW = window.innerWidth - 30;
    const aspect = 1.4142;
    let h = availH, w = h / aspect;
    if (w > availW) { w = availW; h = w * aspect; }
    w = Math.round(w); h = Math.round(h);
    frame.style.width = w + "px";
    frame.style.height = h + "px";

    let current = 0;
    const total = pages.length;

    function render() {
      frame.innerHTML = "";
      const cur = document.createElement("div");
      cur.className = "page-face";
      cur.style.position = "static";
      cur.innerHTML = `<img src="${pages[current]}" alt="">`;
      frame.appendChild(cur);
      indicator.textContent = (current + 1) + " / " + total;
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === total - 1;
    }

    function flipTo(newIndex, direction) {
      if (newIndex < 0 || newIndex >= total) return;
      const outgoing = current;
      current = newIndex;

      const layer = document.createElement("div");
      layer.className = "flip-layer";
      layer.style.transformOrigin = direction === "next" ? "left center" : "right center";
      layer.innerHTML = `
        <div class="page-face front"><img src="${pages[outgoing]}" alt=""></div>
        <div class="page-face back"><img src="${pages[newIndex]}" alt=""></div>`;
      if (direction === "prev") {
        layer.style.transform = "rotateY(180deg)";
        layer.querySelector(".front").style.transform = "rotateY(180deg)";
        layer.querySelector(".back").style.transform = "rotateY(0deg)";
      }
      frame.appendChild(layer);
      requestAnimationFrame(() => {
        layer.style.transition = "transform 0.7s cubic-bezier(.4,.1,.2,1)";
        layer.style.transform = direction === "next" ? "rotateY(-180deg)" : "rotateY(0deg)";
      });
      setTimeout(() => { render(); }, 720);
    }

    prevBtn.addEventListener("click", () => flipTo(current - 1, "prev"));
    nextBtn.addEventListener("click", () => flipTo(current + 1, "next"));

    render();
  }
})();
</script>
</body>
</html>
